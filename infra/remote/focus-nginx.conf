# Painel do focus-scrap, que roda na máquina de casa e chega aqui por um túnel
# SSH reverso (usuário 'tunel'). Se o túnel estiver fora do ar, isto responde
# 502 — é o esperado quando o PC de casa está desligado.
server {
    server_name focus.chicofigueiredo.com.br;

    # Rotas que executam coisa na máquina de casa: disparar scrape, transcrever,
    # abrir arquivo no Explorer. Não têm por que existir a partir do tablet.
    location ~ ^/api/(run|requeue|revelar|abrir|sincronizar)$ {
        auth_basic "focus-scrap";
        auth_basic_user_file /etc/nginx/focus.htpasswd;
        return 403;
    }

    location / {
        auth_basic "focus-scrap";
        auth_basic_user_file /etc/nginx/focus.htpasswd;

        proxy_pass http://127.0.0.1:17788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vídeo: repassa o corpo conforme chega, em vez de tentar guardar o
        # arquivo inteiro em disco antes de responder. É o que faz o seek do
        # player funcionar com o Range chegando inteiro no bun do outro lado.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        client_max_body_size 16m;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/focus.chicofigueiredo.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/focus.chicofigueiredo.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = focus.chicofigueiredo.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name focus.chicofigueiredo.com.br;
    return 404; # managed by Certbot


}